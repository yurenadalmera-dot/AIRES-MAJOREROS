name: Deploy a Hostinger (subida manual)

# Empaqueta el código del ref indicado y lo sube al almacenamiento de
# ficheros de un sitio Hostinger vía protocolo TUS, usando credenciales de
# subida de un solo uso generadas justo antes de lanzar este workflow
# (ver hosting_generateUploadURLV1 en el MCP de Hostinger). No se guarda
# ningún secreto en el repositorio: las credenciales se pasan como inputs
# en el momento de ejecutar el workflow y expiran a las pocas horas.

on:
  workflow_dispatch:
    inputs:
      upload_url:
        description: "URL base devuelta por hosting_generateUploadURLV1"
        required: true
        type: string
      auth_key:
        description: "X-Auth (JWT de un solo uso, expira en unas horas)"
        required: true
        type: string
      rest_auth_key:
        description: "X-Auth-Rest (token de un solo uso)"
        required: true
        type: string
      archive_name:
        description: "Nombre del archivo a subir"
        required: false
        type: string
        default: "app.zip"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enmascarar credenciales en los logs
        run: |
          echo "::add-mask::${{ inputs.auth_key }}"
          echo "::add-mask::${{ inputs.rest_auth_key }}"

      - name: Empaquetar el código (excluye node_modules, .git, .next)
        run: git archive --format=zip -o "${{ inputs.archive_name }}" HEAD

      - name: Subir a Hostinger (TUS)
        env:
          URL: ${{ inputs.upload_url }}
          AUTH: ${{ inputs.auth_key }}
          REST_AUTH: ${{ inputs.rest_auth_key }}
          FILE: ${{ inputs.archive_name }}
        run: |
          SIZE=$(stat -c%s "$FILE")
          echo "Subiendo $FILE ($SIZE bytes)..."

          create_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${URL}/${FILE}?override=true" \
            -H "X-Auth: ${AUTH}" \
            -H "X-Auth-Rest: ${REST_AUTH}" \
            -H "Tus-Resumable: 1.0.0" \
            -H "Upload-Length: ${SIZE}" \
            -H "Upload-Offset: 0")
          echo "Create status: $create_status"
          if [ "$create_status" != "201" ]; then
            echo "::error::Fallo al crear la subida (status $create_status)"
            exit 1
          fi

          patch_status=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "${URL}/${FILE}?override=true" \
            -H "X-Auth: ${AUTH}" \
            -H "X-Auth-Rest: ${REST_AUTH}" \
            -H "Tus-Resumable: 1.0.0" \
            -H "Content-Type: application/offset+octet-stream" \
            -H "Upload-Offset: 0" \
            --data-binary "@${FILE}")
          echo "Patch status: $patch_status"
          if [ "$patch_status" != "204" ]; then
            echo "::error::Fallo al subir el archivo (status $patch_status)"
            exit 1
          fi
          echo "✅ Subida completada"
